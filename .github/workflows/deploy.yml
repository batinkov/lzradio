name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag is strict semver and matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="$GITHUB_REF_NAME"
          if ! printf '%s' "$TAG_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Tag $TAG_NAME is not strict semver (expected vX.Y.Z, no prerelease suffix)"
            exit 1
          fi
          PKG=$(node -p "require('./package.json').version")
          if [ "${TAG_NAME#v}" != "$PKG" ]; then
            echo "::error::Tag $TAG_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "Version check passed: $PKG"

      - name: Verify tagged commit is on master
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::Tagged commit is not an ancestor of master"
            exit 1
          fi
          echo "Ancestry check passed."

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

version: 2

# Routine version updates. Security updates are separate: GitHub opens those
# automatically from Dependabot alerts and does not read this file, so nothing
# here can delay a fix for a published advisory.
#
# Grouping: minor and patch bumps arrive as one PR per ecosystem per week.
# Major bumps are deliberately left out of the groups so each one arrives as its
# own PR — a major deserves to be looked at on its own, not merged as part of a
# batch. Before this config existed, dependencies only ever moved when an
# advisory forced them, which is how vite went 6.4.2 -> 8.0.16 in a single
# commit alongside a security fix.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # Some families publish their packages with exact cross-pins, so a major
      # cannot move one package at a time. vitest@4.1.0 depends on
      # "@vitest/mocker": "4.1.0" and @vitest/ui@4.1.0 peer-depends on
      # "vitest": "4.1.0" — all exact. Splitting that major produced three
      # individually-red PRs (#15, #20, #21) that were really one upgrade.
      # eslint@9.39.1 pins "@eslint/js": "9.39.1" the same way.
      #
      # Scoped to major only: minor and patch already travel together in the
      # dev group below, so this adds no extra weekly PR. Listed first, because
      # a dependency joins the first group whose criteria it matches.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - major
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
        update-types:
          - major
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
